name: Verify harness
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Rust format, lint and tests
        run: |
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.99.1 test --workspace --locked
          cargo +1.99.1 build --workspace --locked
      - name: Exercise execution and recovery without cloud credentials
        run: |
          python3 scripts/smoke.py
          python3 scripts/reliability_smoke.py
          python3 scripts/company_factory_smoke.py
          python3 scripts/coordination_smoke.py
      - name: Verify offline public network boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_company_tools.py'
          python3 -m unittest discover -s scripts -p 'test_public_network.py'
          node --test scripts/public-network.test.mjs
      - name: Web build and dependency advisory check
        run: |
          npm ci
          node --check web/app.js
          npm run build
          npm run test:site
          npm run site:build:production
          python3 scripts/verify_introduction.py
          node --test scripts/sync-vercel-website-env.test.mjs
          python3 -m unittest discover -s scripts -p test_weight_prompt_formats.py
          npm audit --audit-level=high
