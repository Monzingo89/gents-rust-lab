[package]
name = "gents-local-mcp"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.99"
default-run = "gents-local-mcp"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks"] }
sha2 = "0.10"
syn = { version = "=3.0.9", features = ["full", "visit"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "rt-multi-thread", "macros", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
