# Extend all default provider and generic rules. Only reviewed public literals
# on their exact source paths are exempted from the generic rule.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed public hash or validation prose"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/70\-keyed\-completion\-review\-and\-v2\-qualification\.md$''']
