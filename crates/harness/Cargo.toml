[package]
name = "gents-harness"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.99"

[dependencies]
gents-local-mcp = { path = "../../mcp" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "0.10"
